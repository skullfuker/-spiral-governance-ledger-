- name: Run Pytest Suite with Coverage
  shell: bash
  env:
    PYTHONPATH: ${{ github.workspace }}
  run: |
    set -euo pipefail
    python -m pytest tests/test_lattice_ledger.py -v \
      --cov=lattice_ledger \
      --cov-report=term-missing \
      --cov-report=xml:coverage.xml \
      --cov-fail-under="${MIN_COVERAGE_THRESHOLD}"
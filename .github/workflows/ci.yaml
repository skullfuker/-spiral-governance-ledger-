name: CI v5

on:
  push:
    branches:
      - main
      - master
      - spiral-governance-ledger
  pull_request:

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Test + Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MIN_COVERAGE_THRESHOLD: "95"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest==8.3.2 pytest-cov==5.0.0

      - name: Run Pytest Suite with Coverage & 95% Threshold Gate
        shell: bash
        run: |
          set -euo pipefail
          echo "=== STAGE 1: RUNNING PYTEST VALIDATION & COVERAGE THRESHOLD GATE ==="

          TARGET_FILE=""
          if [ -d "tests" ] && [ -f "tests/test_worm_policy.py" ]; then
            TARGET_FILE="tests/test_worm_policy.py"
          elif [ -f "test_worm_policy.py" ]; then
            TARGET_FILE="test_worm_policy.py"
          fi

          if [ -n "$TARGET_FILE" ]; then
            echo "Executing Pytest on $TARGET_FILE with coverage enforcement (min ${MIN_COVERAGE_THRESHOLD}%)..."
            pytest "$TARGET_FILE" -v \
              --cov=. \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under="${MIN_COVERAGE_THRESHOLD}"
          else
            echo "No worm policy test file found; running direct validation fallback..."
            if [ -f "test_worm_policy.py" ]; then
              python -u test_worm_policy.py
            else
              echo "No validation script found; failing CI."
              exit 1
            fi

            if [ ! -f "coverage.xml" ]; then
              echo "Coverage XML was not generated during fallback validation; failing workflow."
              exit 1
            fi
          fi

      - name: Upload Coverage XML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
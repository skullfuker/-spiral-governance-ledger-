name: CI — Ledger run & S3 anchor

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  run-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      WORM_VAULT_URI: ${{ vars.WORM_VAULT_URI || 's3://sovereign-lattice-worm-vault' }}
      DEBUG_BOTOCORE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install OS build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libzstd-dev python3-dev

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ ! -f requirements.txt ]; then
            echo "requirements.txt not found in repo root"
            exit 5
          fi
          python -m pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Skip AWS configuration
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        run: |
          echo "AWS_ROLE_TO_ASSUME is not configured; skipping AWS-authenticated steps."
          echo "This is expected for non-AWS CI runs."

      - name: Verify AWS credentials
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json

      - name: Print environment and workspace debug info
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Python: $(python --version)"
          echo "Pip packages:"
          pip list --format=columns
          echo "Listing repository root:"
          ls -la
          echo "AWS identity (sts):"
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            aws sts get-caller-identity --output json || true
          else
            echo "AWS not configured; skipped"
          fi
          echo "Quick check of target S3 bucket (may fail if no permissions):"
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            aws s3 ls "${WORM_VAULT_URI}" || true
          else
            echo "AWS not configured; skipped"
          fi

      - name: Run ledger script (strict + unbuffered)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          WORM_VAULT_URI: ${{ env.WORM_VAULT_URI }}
        run: |
          set -euxo pipefail
          SCRIPT_PATH="./ledger.py"
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "Error: ledger script not found at $SCRIPT_PATH"
            ls -la
            exit 4
          fi
          if [ "${DEBUG_BOTOCORE:-}" = '1' ]; then
            export BOTOCORE_LOG_LEVEL=DEBUG
          fi
          python -u "$SCRIPT_PATH"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== WORKSPACE LISTING ==="
          ls -la
          echo "=== PYTHON DEPENDENCIES ==="
          pip list --format=columns || true
          echo "=== AWS STS ==="
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            aws sts get-caller-identity || true
          else
            echo "AWS not configured; skipped"
          fi
          echo "=== Sample S3 bucket head attempt ==="
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            aws s3 ls "${WORM_VAULT_URI}" || true
          else
            echo "AWS not configured; skipped"
          fi

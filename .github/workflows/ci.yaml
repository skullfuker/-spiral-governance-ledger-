name: Sovereign Lattice CI

on:
  push:
    branches: [ "spiral-governance-ledge", "main" ]
  pull_request:
    branches: [ "spiral-governance-ledge", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE_THRESHOLD: 95
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov boto3 botocore

      - name: Run Pytest Suite with Coverage
        shell: bash
        env:
          PYTHONPATH: .github/workflows/.github/workflows
        run: |
          set -euo pipefail
          if [ -f ".github/workflows/.github/workflows/tests/test_lattice.py" ]; then
            pytest .github/workflows/.github/workflows/tests/test_lattice.py -v \
              --cov=pure_structure \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under="${MIN_COVERAGE_THRESHOLD}"
          elif [ -f "test/test_lattice.py" ]; then
            pytest test/test_lattice.py -v \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under="${MIN_COVERAGE_THRESHOLD}"
          else
            echo "No validation test script found."
            exit 1
          fi

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage.xml') != ''
        with:
          name: coverage-report
          path: coverage.xml

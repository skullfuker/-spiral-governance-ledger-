name: Sovereign OS Lattice CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest json_repair

      - name: Execute PureStructuralLayer Verification
        run: |
          python -c "from pure_structure import PureStructuralLayer; print('Lattice module imported successfully.')"
          pytest --maxfail=1 --disable-warnings -q

      - name: Install wasm-pack (pinned)
        env:
          VERSION: "0.15.0"
        run: |
          set -euo pipefail
          ARCHIVE="wasm-pack-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${VERSION}/${ARCHIVE}" -o wasm-pack.tar.gz
          tar xzf wasm-pack.tar.gz
          sudo install -m 0755 "wasm-pack-v${VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version